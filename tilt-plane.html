<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>3D Tilt Plane</title>
<style>
  /* ABC Diatype (trial), self-hosted from /fonts — used for the litchens text mask.
     Each weight gets its own distinct family name so the canvas always renders
     the exact cut requested, with no browser-synthesized fake bold/etc. */
  @font-face {
    font-family: 'ABC Diatype Regular';
    src: url('fonts/ABCDiatypeTrial-Regular.otf') format('opentype');
    font-weight: normal;
    font-style: normal;
  }
  @font-face {
    font-family: 'ABC Diatype Medium';
    src: url('fonts/ABCDiatypeTrial-Medium.otf') format('opentype');
    font-weight: normal;
    font-style: normal;
  }
  @font-face {
    font-family: 'ABC Diatype Bold';
    src: url('fonts/ABCDiatypeTrial-Bold.otf') format('opentype');
    font-weight: normal;
    font-style: normal;
  }
  @font-face {
    font-family: 'ABC Diatype Heavy';
    src: url('fonts/ABCDiatypeTrial-Heavy.otf') format('opentype');
    font-weight: normal;
    font-style: normal;
  }

  /* ABC Diatype Extended (trial) — used for the event-info block (Group 25):
     badges + date use Bold/Regular Extended per the Figma source. */
  @font-face {
    font-family: 'ABC Diatype Extended Regular';
    src: url('fonts/ABCDiatypeExtendedTrial-Regular.otf') format('opentype');
    font-weight: normal;
    font-style: normal;
  }
  @font-face {
    font-family: 'ABC Diatype Extended Bold';
    src: url('fonts/ABCDiatypeExtendedTrial-Bold.otf') format('opentype');
    font-weight: normal;
    font-style: normal;
  }

  /* Printvetica — used for the event-info badges in the newer Figma variant
     ("Instagram post - 16" / Group 26), replacing the ABC Diatype badges. */
  @font-face {
    font-family: 'Printvetica';
    src: url('fonts/Printvetica.otf') format('opentype');
    font-weight: normal;
    font-style: normal;
  }
</style>
<style>
  :root {
    /* ---- Tweak these ---- */
    --tilt-max: 22deg;     /* max rotation at screen edges          */
    --perspective: 1200px; /* smaller = stronger 3D distortion      */
    --ease: 0.08;          /* 0.01 slow/floaty ... 0.2 snappy       */
    --plane-h: 66vmin;     /* plane height (width follows 4:5 ratio) */
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: #000;
    overflow: hidden;
    font-family: system-ui, sans-serif;
  }

  /* The perspective stage — the whole viewport reacts to the cursor */
  .stage {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    perspective: var(--perspective);
    perspective-origin: 50% 50%;
  }

  /* The rectangular object floating in 3D space — a reflective steel plate */
  .plane {
    position: relative;
    height: var(--plane-h);
    aspect-ratio: 1080 / 1350;      /* Instagram portrait, 4:5 */
    transform-style: preserve-3d;
    will-change: transform;
    overflow: hidden;               /* clip the reflection to the plate edges */
    container-type: size;           /* lets children size themselves in cqw/cqh,
                                        proportional to the 1080×1350 design reference */

    background-color: #c8ccd0;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;

    border: 1px solid rgba(0,0,0,0.28);
    box-shadow:
      0 40px 80px -30px rgba(0,0,0,0.85),
      inset 0 1px 0 rgba(255,255,255,0.30),
      inset 0 -1px 0 rgba(0,0,0,0.35);
  }

  /* Three texture directions — click anywhere cycles between them
     (metal_204 / "fluted" removed from the carousel) */
  .plane.tex-0 { background-image: url("textures/metal_136.jpg"); } /* streaked / spotted */
  .plane.tex-1 { background-image: url("textures/metal_230.jpg"); } /* brushed vertical */
  .plane.tex-2 { background-image: url("textures/metal_242.jpg"); } /* hazy reflective  */

  /* The surroundings reflected in the metal. Two soft shapes that move as
     the plate tilts: a light "window" reflection gliding opposite the cursor,
     and a darker smudge (the cursor's own reflection) trailing it.
     ---- Tweak: opacities in the gradients, and travel amounts in the JS ---- */
  .reflection {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
      radial-gradient(62% 48% at var(--lx, 50%) var(--ly, 50%),
        rgba(255,255,255,0.45), rgba(255,255,255,0) 62%),
      radial-gradient(34% 26% at var(--dx, 50%) var(--dy, 50%),
        rgba(8,12,20,0.28), rgba(8,12,20,0) 66%);
    mix-blend-mode: soft-light;
  }

  /* Reflective sheen — a broad soft gradient of light and shadow across the
     whole plate, like a large light source reflecting as the sheet tilts.
     Driven by the tilt, not the cursor point. Sits below the glyph (matte).
     ---- Tweak: opacity below, and the travel amount in the JS ---- */
  .holo {
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: 0.65;
    mix-blend-mode: soft-light;
    background:
      radial-gradient(150% 130% at var(--hx, 50%) var(--hy, 50%),
        rgba(255,255,255,0.65) 0%,
        rgba(255,255,255,0.18) 32%,
        rgba(0,0,0,0.00)       58%,
        rgba(0,0,0,0.30)      100%);
  }

  /* Small tester label — delete this block + the element in <body> to remove */
  .mode-tag {
    position: fixed;
    bottom: 20px; left: 20px;
    color: rgba(255,255,255,0.40);
    font: 12px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: 0.5px;
    user-select: none;
    pointer-events: none;
  }

  /* litchens canvas — shown automatically on load (no more 'L' toggle or
     flyer artwork underneath it). Transparent so metal shows through the
     gaps between live cells. */
  #litchensHolder {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    opacity: 1;
    pointer-events: auto;
  }
  #litchensHolder canvas {
    display: block;
    /* p5 renders at pixelDensity(1), so on a HiDPI screen the browser has
       to stretch this canvas up to fill its CSS size — by default that
       uses smooth interpolation, which blurs the crisp cell edges and
       dulls the fill/outline colors (blending them with neighboring
       pixels). Forcing nearest-neighbor scaling keeps it crisp/saturated
       regardless of display pixel density. */
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    image-rendering: crisp-edges;
  }

  /* Event-info block — static crisp text, not run through the litchens
     pixel/CA grid. Shows/hides together with litchens mode, same as the
     canvas above.
     Matches finaltext.svg exactly: the event text is now the final vector
     artwork (no more brown badge-fill rectangles behind it — that was a
     placeholder and isn't in the end product), embedded as an inline SVG
     sized to fill the plate 1:1 against its locked 1080x1350 aspect ratio,
     so the vector paths scale losslessly at any render size. */
  #eventInfo {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }
  #eventInfo .ei-text-svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  #eventInfo .ei-text-svg path {
    fill: var(--ei-fg, #000000);
  }
  /* Cornell seal — matches Figma's "image 10" node (255:54): 86x86px square
     placed at x=941, y=1221 against the 1080x1350 reference frame. Inlined
     SVG (not <img>) so the white disc can be made transparent and the red
     crest can be recolored via --seal-fg. */
  #eventInfo .ei-seal {
    position: absolute;
    display: block;
  }

  /* Floating litchens control panel — fixed to the viewport, does not tilt
     with the plate. Shown by default since litchens is now the only mode. */
  #litchensControls {
    position: fixed;
    right: 20px;
    top: 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 14px 16px;
    background: rgba(15,15,15,0.72);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 10px;
    backdrop-filter: blur(6px);
    color: rgba(255,255,255,0.85);
    font: 12px/1.4 system-ui, sans-serif;
    z-index: 10;
  }
  #litchensControls label {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  #litchensControls input[type="range"] {
    flex: 1;
  }
  /* Live numeric readout next to each slider, so values are easy to call
     out precisely (e.g. "Cell 5", "Edge Growth 40") when giving feedback. */
  #litchensControls .slider-val {
    min-width: 2em;
    text-align: right;
    color: rgba(255,255,255,0.6);
    font-variant-numeric: tabular-nums;
  }
  #litchensControls input[type="text"] {
    flex: 1;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 4px;
    color: #fff;
    padding: 4px 6px;
    font: inherit;
  }
  #litchensControls button {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 4px;
    color: #fff;
    padding: 5px 10px;
    font: inherit;
    cursor: pointer;
  }
  #litchensControls button:hover { background: rgba(255,255,255,0.18); }
  #litchensControls .row { display: flex; gap: 8px; }
  #litchensControls .row > * { flex: 1; }
  #litchensControls .sep { height: 1px; background: rgba(255,255,255,0.12); margin: 2px 0; }
  #litchensControls .hud { color: rgba(255,255,255,0.5); font-size: 11px; }
  #litchensControls input[type="color"] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 22px;
    padding: 0;
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 4px;
    background: none;
    cursor: pointer;
  }
  #litchensControls input[type="color"]::-webkit-color-swatch-wrapper { padding: 2px; }
  #litchensControls input[type="color"]::-webkit-color-swatch { border: none; border-radius: 2px; }
  #litchensControls .row label {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 4px;
  }
</style>
</head>

  <div class="mode-tag" id="modeTag">1 brushed</div>

  <!-- litchens controls: toggle with 'L', floats above the tilt, does not rotate -->
  <div id="litchensControls">
    <div class="row">
      <button id="playPause">Pause</button>
      <button id="reset">Reseed Full</button>
    </div>
    <div class="sep"></div>
    <label>Cell <input id="cellSize" type="range" min="1" max="16" value="6"> <span id="cellSizeVal" class="slider-val">6</span></label>
    <label>Speed <input id="speed" type="range" min="1" max="12" value="8"> <span id="speedVal" class="slider-val">8</span></label>
    <div class="sep"></div>
    <label>Legibility <input id="legibility" type="range" min="0" max="100" value="100"> <span id="legibilityVal" class="slider-val">100</span></label>
    <label>Edge Growth <input id="edgeGrowth" type="range" min="0" max="100" value="100"> <span id="edgeGrowthVal" class="slider-val">100</span></label>
    <div class="sep"></div>
    <div class="row">
      <label>Fill <input id="fillColorPicker" type="color"></label>
      <input id="fillColorHex" type="text" maxlength="7" placeholder="#000000">
    </div>
    <div class="row">
      <label>Outline <input id="outlineColorPicker" type="color"></label>
      <input id="outlineColorHex" type="text" maxlength="7" placeholder="#E972BD">
    </div>
    <div class="sep"></div>
    <div class="row">
      <label>Badge Text <input id="eiFgColorPicker" type="color"></label>
      <input id="eiFgColorHex" type="text" maxlength="7" placeholder="#000000">
    </div>
    <div class="row">
      <label>Seal <input id="sealColorPicker" type="color"></label>
      <input id="sealColorHex" type="text" maxlength="7" placeholder="#000000">
    </div>
    <div class="hud">gen <span id="genCount">0</span> · live <span id="liveCount">0</span></div>
  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
<script src="litchens/sketch.js"></script>
<script>
  const plane = document.getElementById('plane');
  const refl  = document.getElementById('reflection');
  const holo  = document.getElementById('holo');
  const tag   = document.getElementById('modeTag');
  const litchensHolder   = document.getElementById('litchensHolder');
  const litchensControls = document.getElementById('litchensControls');
  const eventInfo        = document.getElementById('eventInfo');

  // event-info badge colors — swatch picker + hex field kept in sync, same
  // pattern as the litchens fill/outline controls. Applied via CSS custom
  // properties on #eventInfo so every badge updates live.
  function wireColorControl(pickerId, hexId, cssVar, defaultHex) {
    const picker = document.getElementById(pickerId);
    const hex = document.getElementById(hexId);
    picker.value = defaultHex;
    hex.value = defaultHex;
    eventInfo.style.setProperty(cssVar, defaultHex);
    picker.addEventListener('input', (e) => {
      hex.value = e.target.value;
      eventInfo.style.setProperty(cssVar, e.target.value);
    });
    hex.addEventListener('change', (e) => {
      let v = e.target.value.trim();
      if (!v.startsWith('#')) v = '#' + v;
      if (/^#[0-9a-fA-F]{6}$/.test(v)) {
        picker.value = v;
        hex.value = v;
        eventInfo.style.setProperty(cssVar, v);
      } else {
        hex.value = eventInfo.style.getPropertyValue(cssVar) || defaultHex; // revert on bad input
      }
    });
  }
  wireColorControl('eiFgColorPicker', 'eiFgColorHex', '--ei-fg', '#000000');
  wireColorControl('sealColorPicker', 'sealColorHex', '--seal-fg', '#000000');

  // programmatic version of wireColorControl's picker-input branch, used to
  // swap the event-info/seal colors automatically when the texture changes
  function setColorControl(pickerId, hexId, cssVar, hex) {
    const picker = document.getElementById(pickerId);
    const hexInput = document.getElementById(hexId);
    picker.value = hex;
    hexInput.value = hex;
    eventInfo.style.setProperty(cssVar, hex);
  }

  // texture-specific palette: outline / fill (litchens) + text / badge
  // (event-info + seal) colors swap together whenever the plate texture
  // is toggled, so each metal gets its own matching color scheme.
  const TEXTURE_PALETTES = [
    { outline: '#f46d25', fill: '#cab64e', text: '#ababab', badge: '#ababab' }, // tex-0 · streaked (metal_136)
    { outline: '#687fc4', fill: '#ca5844', text: '#828282', badge: '#525252' }, // tex-1 · brushed (metal_230)
    { outline: '#dc556e', fill: '#ae945b', text: '#c2c1c1', badge: '#f0efef' }, // tex-2 · hazy (metal_242)
  ];
  function applyTexturePalette(m) {
    const p = TEXTURE_PALETTES[m];
    if (!p) return;
    if (typeof setLitchensColors === 'function') setLitchensColors(p.fill, p.outline);
    setColorControl('eiFgColorPicker', 'eiFgColorHex', '--ei-fg', p.text);
    setColorControl('sealColorPicker', 'sealColorHex', '--seal-fg', p.badge);
  }

  const root  = document.documentElement;
  const TILT  = parseFloat(getComputedStyle(root).getPropertyValue('--tilt-max'));
  const EASE  = parseFloat(getComputedStyle(root).getPropertyValue('--ease'));

  // target cursor position, normalized to -1 .. 1 (center = 0)
  let tnx = 0, tny = 0;
  // eased cursor + eased tilt (degrees)
  let nx = 0, ny = 0, cx = 0, cy = 0;

  function onMove(clientX, clientY) {
    tnx = (clientX / window.innerWidth)  * 2 - 1;
    tny = (clientY / window.innerHeight) * 2 - 1;
  }

  window.addEventListener('mousemove', e => onMove(e.clientX, e.clientY));
  window.addEventListener('touchmove', e => {
    if (e.touches[0]) onMove(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: true });

  // ease back to flat when the cursor leaves
  window.addEventListener('mouseleave', () => { tnx = 0; tny = 0; });

  // click anywhere cycles through the three texture directions — except
  // inside the litchens controls panel. In litchens mode, a click both
  // paints a cell (via p5's own mousePressed handler) and cycles the
  // texture, same as clicking anywhere else on the plate.
  const MODES = ['streaked', 'brushed', 'hazy'];
  let mode = 0;
  window.addEventListener('click', (e) => {
    if (litchensControls.contains(e.target)) return;
    mode = (mode + 1) % MODES.length;
    plane.className = 'plane tex-' + mode;
    applyTexturePalette(mode);
    updateTag();
  });

  function updateTag() {
    tag.textContent = (mode + 1) + ' ' + MODES[mode];
  }
  updateTag();
  applyTexturePalette(mode); // set the tex-0 (brushed) palette on load

  function render() {
    // ease everything toward its target for smooth, weighty motion
    nx += (tnx - nx) * EASE;
    ny += (tny - ny) * EASE;
    cx += (-tny * TILT - cx) * EASE;   // rotateX (inverted)
    cy += ( tnx * TILT - cy) * EASE;   // rotateY

    plane.style.transform =
      `rotateX(${cx.toFixed(3)}deg) rotateY(${cy.toFixed(3)}deg) translateZ(0)`;

    // environment reflection glides opposite the cursor;
    // the cursor's own reflection trails just behind it
    refl.style.setProperty('--lx', (50 - nx * 30).toFixed(1) + '%');
    refl.style.setProperty('--ly', (50 - ny * 30).toFixed(1) + '%');
    refl.style.setProperty('--dx', (50 + nx * 45).toFixed(1) + '%');
    refl.style.setProperty('--dy', (50 + ny * 45).toFixed(1) + '%');

    // broad sheen: the "lit side" glides opposite the tilt, as a large
    // reflected light source would as you angle the sheet
    holo.style.setProperty('--hx', (50 - nx * 70).toFixed(1) + '%');
    holo.style.setProperty('--hy', (50 - ny * 70).toFixed(1) + '%');

    requestAnimationFrame(render);
  }
  render();
</script>
